server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # Security headers — safe defaults for both HTTP and HTTPS deployments.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        # Two model attempts plus an explicitly configured fallback (default budgets).
        proxy_read_timeout 150s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger-ui/ {
        proxy_pass http://backend:8080/swagger-ui/;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080/v3/api-docs;
    }
}

# HTTPS termination — disabled until real certificates for the production
# domain are available. To enable: obtain certs (e.g. via certbot/Let's
# Encrypt or your infra provider), mount them into the container, update
# ssl_certificate paths below, uncomment this block, and change the http
# server above to redirect to https (see commented lines).
#
# server {
#     listen 443 ssl http2;
#     server_name your-production-domain.example;
#
#     ssl_certificate     /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_ciphers         HIGH:!aNULL:!MD5;
#
#     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
#
#     # ... same root/location blocks as the http server above ...
# }
