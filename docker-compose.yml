services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sbertrack}
      POSTGRES_USER: ${POSTGRES_USER:-sbertrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sbertrack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sbertrack-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sbertrack} -d ${POSTGRES_DB:-sbertrack}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - sbertrack-platform

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx768m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-sbertrack}
      DB_USER: ${POSTGRES_USER:-sbertrack}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sbertrack}
      UPLOAD_DIR: /app/uploads
      UPLOAD_MAX_SIZE_BYTES: ${UPLOAD_MAX_SIZE_BYTES:-20971520}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-32bytes+}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-24}
      AGENT_ACTIVE_PROFILE: ${AGENT_ACTIVE_PROFILE:-mock}
      AGENT_FALLBACK_PROFILE: ${AGENT_FALLBACK_PROFILE:-}
      AGENT_MAX_INPUT_CHARS: ${AGENT_MAX_INPUT_CHARS:-32000}
      AGENT_MAX_HISTORY_MESSAGES: ${AGENT_MAX_HISTORY_MESSAGES:-20}
      AGENT_CLOUD_BASE_URL: ${AGENT_CLOUD_BASE_URL:-}
      AGENT_CLOUD_API_KEY: ${AGENT_CLOUD_API_KEY:-}
      AGENT_CLOUD_MODEL: ${AGENT_CLOUD_MODEL:-}
      AGENT_CLOUD_TOKEN_LIMIT_FIELD: ${AGENT_CLOUD_TOKEN_LIMIT_FIELD:-max_tokens}
      AGENT_LOCAL_BASE_URL: ${AGENT_LOCAL_BASE_URL:-http://host.docker.internal:8000/v1}
      AGENT_LOCAL_API_KEY: ${AGENT_LOCAL_API_KEY:-}
      AGENT_LOCAL_MODEL: ${AGENT_LOCAL_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_SMTP_STARTTLS: ${SPRING_MAIL_SMTP_STARTTLS:-true}
      SBERTRACK_NOTIFICATION_FROM_EMAIL: ${SBERTRACK_NOTIFICATION_FROM_EMAIL:-noreply@sbertrack.local}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - sbertrack-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - sbertrack-platform

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sbertrack-platform

networks:
  sbertrack-platform:
    name: sbertrack-platform

volumes:
  sbertrack-postgres-data:
    name: sbertrack-postgres-data
  sbertrack-uploads:
    name: sbertrack-uploads
